<!-- Stats Table Editor Modal -->
<link rel="stylesheet" href="css/modal-common.css">
<link rel="stylesheet" href="css/sortable-common.css">

<div id="statsTableModal" class="ywbmodal">
        <div class="modal-content">
        <div class="modal-body">
            <div class="form-group" style="max-width: 200px;">
                <h5>Table Name</h5>
                <input type="text" class="form-control" id="tableName">
            </div>

            <div class="columns-flex-container">
                <div class="columns-section">
                    <h5>Columns</h5>
                    <div class="editor-section-controls">
                        <button id="openStatusColumn" type="button" class="btn btn-sm btn-outline-primary">+ Status</button>
                        <button id="openCustomColumns" type="button" class="btn btn-sm btn-outline-primary">+ Formula</button>
                        <button id="openEventColumn" type="button" class="btn btn-sm btn-outline-primary">+ Event</button>
                    </div>
                    <div class="columns-container">
                        <div id="metricsColumns" class="metricsColumns"></div>
                    </div>
                    <div class="column-selection-actions">
                        <button id="selectAllMetrics" type="button" class="btn btn-sm btn-outline-secondary">Select all</button>
                        <button id="deselectAllMetrics" type="button" class="btn btn-sm btn-outline-secondary">Deselect all</button>
                    </div>
                </div>

                <div class="columns-section">
                    <h5>Group By</h5>
                    <div class="editor-section-controls">
                        <button id="addParamDimension" class="btn btn-sm btn-outline-primary">+ URL Param</button>
                        <button id="openMvtGrouping" type="button" class="btn btn-sm btn-outline-primary">+ MVT</button>
                    </div>
                    <div class="columns-container">
                        <div id="dimensionsColumns" class="dimensionsColumns"></div>
                    </div>
                </div>

                <div class="filters-section">
                    <h5>Filters</h5>
                    <div class="editor-section-controls">
                        <button id="addFilterRow" class="btn btn-sm btn-outline-primary">+ Add</button>
                        <label style="margin-right: 8px;">Condition:</label>
                        <select id="filterCondition" class="form-control" style="width: 80px; display: inline-block;">
                            <option value="AND">AND</option>
                            <option value="OR">OR</option>
                        </select>
                    </div>
                    <div class="columns-container">
                        <div id="filterRows"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" id="cancelTableBtn">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveTableBtn">Save</button>
        </div>

        <div id="customColumnsModal" style="display:none; position:absolute; inset:14px; background:#0f172a; border:1px solid #2a3245; border-radius:12px; z-index:20; box-shadow:0 18px 50px rgba(0,0,0,0.45); overflow:hidden;">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid #25324a;">
                <h5 style="margin:0;">Custom Columns</h5>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button id="addCustomColumn" type="button" class="btn btn-sm btn-outline-primary">+ Add Formula</button>
                    <button id="closeCustomColumns" type="button" class="btn btn-sm btn-secondary">Done</button>
                </div>
            </div>
            <div style="padding:14px 16px; max-height:min(70vh, 720px); overflow:auto;">
                <div id="customColumnsList"></div>
            </div>
        </div>

        <div id="statusColumnModal" style="display:none; position:absolute; inset:14px; background:#0f172a; border:1px solid #2a3245; border-radius:12px; z-index:21; box-shadow:0 18px 50px rgba(0,0,0,0.45); overflow:hidden;">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid #25324a;">
                <h5 style="margin:0;">Status column</h5>
                <button id="closeStatusColumn" type="button" class="btn btn-sm btn-secondary">Cancel</button>
            </div>
            <div style="padding:18px 20px; max-height:min(74vh, 760px); overflow:auto;">
                <div class="row" style="row-gap:14px;">
                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                        <label for="statusColumnStatus">Status</label>
                        <select id="statusColumnStatus" class="form-control"></select>
                    </div>
                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                        <label for="statusColumnTitle">Column name</label>
                        <input id="statusColumnTitle" type="text" class="form-control" placeholder="Reg — Count">
                    </div>
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                        <label>Calculation</label>
                        <div id="statusCalculationChoices" style="display:grid; grid-template-columns:repeat(2, minmax(220px, 1fr)); gap:10px;">
                            <label class="status-calculation-choice"><input type="radio" name="statusCalculation" value="current" checked> <strong>Current</strong> <i class="bi bi-info-circle" tabindex="0" title="Counts clickids whose latest accepted status equals the selected status."></i><small>Latest status now</small></label>
                            <label class="status-calculation-choice"><input type="radio" name="statusCalculation" value="count"> <strong>Count</strong> <i class="bi bi-info-circle" tabindex="0" title="Counts every accepted conversion row with the selected status. One clickid can be counted more than once."></i><small>All accepted rows</small></label>
                            <label class="status-calculation-choice"><input type="radio" name="statusCalculation" value="unique"> <strong>Unique clickids</strong> <i class="bi bi-info-circle" tabindex="0" title="Counts distinct clickids that have at least one accepted row with the selected status."></i><small>Each clickid once</small></label>
                            <label class="status-calculation-choice"><input type="radio" name="statusCalculation" value="nth"> <strong>Nth occurrence</strong> <i class="bi bi-info-circle" tabindex="0" title="Counts clickids whose selected occurrence of this status falls inside the attribution period."></i><small>Selected occurrence in period</small></label>
                        </div>
                    </div>
                    <div id="statusOccurrenceRow" class="col-lg-4 col-md-5 col-sm-8 col-xs-12" style="display:none;">
                        <label for="statusColumnOccurrence">Occurrence</label>
                        <input id="statusColumnOccurrence" type="number" class="form-control" min="1" step="1" value="2">
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:18px;">
                    <button id="addStatusColumn" type="button" class="btn btn-primary">Add column</button>
                </div>
                <div id="configuredStatusColumnsSection" style="margin-top:20px; border-top:1px solid #25324a; padding-top:14px;">
                    <h6>Configured status columns</h6>
                    <div id="configuredStatusColumns"></div>
                </div>
            </div>
        </div>

        <div id="eventColumnModal" style="display:none; position:absolute; inset:14px; background:#0f172a; border:1px solid #2a3245; border-radius:12px; z-index:22; box-shadow:0 18px 50px rgba(0,0,0,0.45); overflow:hidden;">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid #25324a;">
                <h5 style="margin:0;">Event column</h5>
                <button id="closeEventColumn" type="button" class="btn btn-sm btn-secondary">Done</button>
            </div>
            <div style="padding:18px 20px; max-height:min(74vh, 760px); overflow:auto;">
                <div class="row" style="row-gap:14px;">
                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                        <label for="eventColumnMetric">Metric</label>
                        <select id="eventColumnMetric" class="form-control"></select>
                    </div>
                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                        <label for="eventColumnAggregation">Calculation</label>
                        <select id="eventColumnAggregation" class="form-control"></select>
                    </div>
                    <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                        <div id="eventColumnDescription" style="font-size:13px; color:#9fb2d4;"></div>
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:18px;">
                    <button id="addEventColumn" type="button" class="btn btn-primary">Add column</button>
                </div>
                <div id="configuredEventColumnsSection" style="margin-top:20px; border-top:1px solid #25324a; padding-top:14px;">
                    <h6>Configured event columns</h6>
                    <div id="configuredEventColumns"></div>
                </div>
            </div>
        </div>

        <div id="mvtGroupingModal" class="stats-editor-overlay" style="display:none; z-index:23;">
            <div class="stats-editor-overlay-header">
                <h5>MVT grouping</h5>
            </div>
            <div class="stats-editor-overlay-body">
                <label for="mvtPlacement">Landing</label>
                <select id="mvtPlacement" class="form-control"></select>
                <label class="mvt-all-combinations-choice" for="mvtAllCombinations">
                    <input id="mvtAllCombinations" type="checkbox">
                    <span>All combinations</span>
                </label>
                <p class="mvt-grouping-hint">Turn this off to select TESTs. Drag selected rows to set the nesting order.</p>
                <div id="mvtTestsList" class="mvt-tests-list"></div>
            </div>
            <div class="stats-editor-overlay-footer">
                <button id="removeMvtGrouping" type="button" class="btn btn-outline-danger">Remove MVT</button>
                <div>
                    <button id="cancelMvtGrouping" type="button" class="btn btn-secondary">Cancel</button>
                    <button id="applyMvtGrouping" type="button" class="btn btn-primary">OK</button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .status-calculation-choice { display:grid; grid-template-columns:auto auto auto 1fr; align-items:center; column-gap:7px; row-gap:2px; padding:11px 12px; border:1px solid #344258; border-radius:8px; cursor:pointer; }
    .status-calculation-choice:has(input:checked) { border-color:#4f8cff; background:rgba(79,140,255,.1); }
    .status-calculation-choice small { grid-column:2 / -1; opacity:.68; }
    .configured-status-column { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 10px; border:1px solid #2a3245; border-radius:7px; margin-top:7px; }
    #statsTableModal .columns-section > h5, #statsTableModal .filters-section > h5 { margin-bottom:10px; }
    .editor-section-controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; min-height:38px; margin:0 0 10px; }
    .editor-section-controls .btn { margin:0 !important; }
    .column-selection-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .columns-section:has(#metricsColumns) .columns-container { height:calc(50vh - 44px); }
    .stats-editor-overlay { position:absolute; inset:14px; background:#0f172a; border:1px solid #2a3245; border-radius:12px; box-shadow:0 18px 50px rgba(0,0,0,.45); overflow:hidden; }
    .stats-editor-overlay-header, .stats-editor-overlay-footer { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; border-bottom:1px solid #25324a; }
    .stats-editor-overlay-header h5 { margin:0; }
    .stats-editor-overlay-footer { border-top:1px solid #25324a; border-bottom:0; }
    .stats-editor-overlay-footer > div { display:flex; gap:8px; }
    .stats-editor-overlay-body { padding:16px; max-height:min(65vh, 650px); overflow:auto; }
    .stats-editor-overlay-body > label:first-child { display:block; margin:0 0 5px; color:#cbd5e1; font-size:13px; }
    .mvt-all-combinations-choice { display:flex; align-items:center; gap:8px; margin:16px 0 5px; cursor:pointer; }
    .mvt-grouping-hint { margin:0 0 10px; color:#93a4c2; font-size:13px; }
    .mvt-tests-list { display:grid; gap:7px; }
    .mvt-test-choice { display:flex; align-items:center; gap:10px; padding:9px 10px; border:1px solid #344258; border-radius:8px; background:rgba(30,41,59,.55); }
    .mvt-test-choice.is-disabled { opacity:.45; }
    .mvt-test-choice .drag-handle { cursor:grab; }
    #dimensionsColumns .mvt-groupby-item { display:flex !important; align-items:center; margin:4px 0 7px; }
    #dimensionsColumns .mvt-groupby-item .drag-handle { margin-right:8px !important; }
    #dimensionsColumns .mvt-groupby-item input[type="checkbox"] { margin-right:12px !important; }
    #dimensionsColumns .mvt-groupby-title { flex:0 0 auto; min-width:0; }
    #dimensionsColumns .mvt-groupby-actions { display:flex !important; align-items:center; gap:3px; margin-left:auto !important; }
    #dimensionsColumns .mvt-groupby-actions .btn { display:inline-flex !important; align-items:center !important; justify-content:center !important; width:22px !important; min-width:22px !important; height:22px !important; min-height:22px !important; margin:0 !important; padding:0 !important; line-height:1 !important; }
    #dimensionsColumns .mvt-groupby-actions .btn i { pointer-events:none; font-size:11px; line-height:1; }
    #dimensionsColumns .mvt-groupby-info { display:inline-flex !important; align-items:center; justify-content:center; width:20px !important; height:20px !important; margin:0 !important; padding:0 !important; border:0; background:transparent; color:#8fb8ff; cursor:help; line-height:1; }
    #dimensionsColumns .mvt-groupby-info-symbol { display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px; border:1px solid currentColor; border-radius:50%; color:inherit; font-size:10px; font-weight:700; font-style:normal; line-height:1; }
    .mvt-groupby-tooltip { position:fixed; z-index:1000005; width:min(330px, calc(100vw - 24px)); padding:9px 11px; border:1px solid #34507c; border-radius:7px; background:#0d1830; color:#dbe6ff; font-size:12px; font-weight:400; line-height:1.45; text-align:left; white-space:normal; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.3); }
    #statsTableModal.is-mvt-grouping-open > .modal-content > .modal-body,
    #statsTableModal.is-mvt-grouping-open > .modal-content > .modal-footer { display:none; }
    #statsTableModal.is-mvt-grouping-open { width:min(640px, calc(100vw - 32px)) !important; max-width:640px !important; }
    #statsTableModal.is-mvt-grouping-open .stats-editor-overlay { position:relative; inset:auto; display:flex !important; flex-direction:column; max-height:min(80vh, 650px); border:0; border-radius:12px; box-shadow:none; }
    #statsTableModal.is-mvt-grouping-open .stats-editor-overlay-body { flex:1; max-height:min(62vh, 540px); }
    #dimensionsColumns .column-item.is-mvt-incompatible { opacity:.45; }
    @media (max-width: 760px) {
        #statsTableModal { width:calc(100vw - 16px) !important; max-height:96vh !important; }
        #statsTableModal .modal-content { max-height:96vh; }
        #statsTableModal .modal-body { padding:12px; }
        #statsTableModal .columns-flex-container { display:grid; grid-template-columns:minmax(0, 1fr); gap:18px; }
        #statsTableModal .columns-flex-container .columns-section,
        #statsTableModal .columns-flex-container .filters-section { width:100%; min-width:0; overflow:visible; }
        #statsTableModal .columns-container { height:min(42vh, 360px); }
        #statsTableModal .columns-section:has(#metricsColumns) .columns-container { height:calc(min(42vh, 360px) - 44px); }
        #statsTableModal .filters-section .columns-container { height:auto; max-height:42vh; }
        .editor-section-controls { min-height:0; }
        .stats-editor-overlay { inset:8px; }
        .stats-editor-overlay-footer { align-items:flex-start; flex-direction:column; }
    }
</style>

<script src="js/sortable-common.js"></script>
<script src="js/statstableeditor.js"></script>
